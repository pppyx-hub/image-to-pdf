<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="在浏览器本地把多张图片合成 PDF：可排序、旋转、设置纸张与边距，图片不会上传到服务器。" />
  <meta name="theme-color" content="#4f46e5" />
  <title>图片转 PDF · 本地离线工具</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='9'%20fill='%234f46e5'/%3E%3Cpath%20d='M9.5%206.5h8.5l4.5%204.5v14.5h-13z'%20fill='none'%20stroke='white'%20stroke-width='1.5'/%3E%3Cpath%20d='M12%2021l3.2-3.2%202.2%202.2%202.2-2.2%203.4%203.4'%20fill='none'%20stroke='white'%20stroke-width='1.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3.5h7.5l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z" />
            <path d="M13.2 3.8v4.4h4.4" />
            <circle cx="9.2" cy="13.1" r="1.25" />
            <path d="M6.1 18.4l3.3-3.3 2.3 2.3 2-2 3.1 3.1" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>图片转 PDF</h1>
          <p>本地处理 · 图片不上传 · 断网也能用</p>
        </div>
      </div>
      <span class="status-pill" id="statusPill">等待添加图片</span>
    </header>

    <main class="workspace">
      <section class="panel panel-files">
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="添加图片">
          <div class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8.6" cy="9" r="1.5" />
              <path d="M4.2 17.4l5.1-5.1 3.6 3.6 2.6-2.6 4.3 4.3" />
            </svg>
          </div>
          <p class="dropzone-title">把图片拖到这里，或 <span class="link">点击选择文件</span></p>
          <p class="dropzone-hint">支持 JPG / PNG / WebP / GIF / BMP · 可多选或拖入整个文件夹</p>
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
        </div>

        <div class="list-head">
          <div class="list-stat"><strong id="countText">0</strong> 张图片 <span class="sep">·</span> 共 <strong id="pageText">0</strong> 页</div>
          <div class="list-tools">
            <button type="button" class="ghost-btn" id="btnSort">按文件名排序</button>
            <button type="button" class="ghost-btn is-danger" id="btnClear">清空</button>
          </div>
        </div>

        <div class="empty-state" id="emptyState">
          <div class="empty-art" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="14" width="34" height="34" rx="5" transform="rotate(-6 8 14)" opacity=".35" />
              <rect x="20" y="12" width="36" height="36" rx="5" opacity=".7" />
              <circle cx="31" cy="25" r="3.2" />
              <path d="M21.5 41l8.6-8.6 5.7 5.7 3.8-3.8 7.5 7.5" />
            </svg>
          </div>
          <p class="empty-title">还没有添加图片</p>
          <p class="empty-hint">从上面的区域拖入或选择图片，排列好后点击右侧「生成 PDF」</p>
          <button type="button" class="ghost-btn demo-btn" id="btnDemo">载入示例图片试试</button>
        </div>

        <div class="file-list" id="fileList" aria-live="polite"></div>
      </section>

      <aside class="panel panel-settings">
        <h2 class="panel-title">排版设置</h2>

        <div class="field">
          <label class="field-label" for="inputName">文件名</label>
          <div class="input-suffix">
            <input type="text" id="inputName" value="图片合集" maxlength="60" spellcheck="false" />
            <span class="suffix">.pdf</span>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label" for="selPageSize">纸张</label>
            <select id="selPageSize">
              <option value="A4" selected>A4（210 × 297 mm）</option>
              <option value="A3">A3（297 × 420 mm）</option>
              <option value="Letter">Letter（8.5 × 11 in）</option>
              <option value="auto">自适应（跟随图片比例）</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="selOrientation">方向</label>
            <select id="selOrientation">
              <option value="auto" selected>自动</option>
              <option value="portrait">纵向</option>
              <option value="landscape">横向</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label" for="selMargin">页边距</label>
            <select id="selMargin">
              <option value="0">无边框</option>
              <option value="8">窄（8 mm）</option>
              <option value="15" selected>适中（15 mm）</option>
              <option value="25">宽（25 mm）</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="selPerPage">每页张数</label>
            <select id="selPerPage">
              <option value="1" selected>1 张 / 页</option>
              <option value="2">2 张 / 页</option>
              <option value="4">4 张 / 页</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="selFit">图片填充</label>
          <select id="selFit">
            <option value="contain" selected>适应页面（完整显示，可能留白）</option>
            <option value="cover">铺满页面（铺满裁切多余部分）</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="selQuality">输出画质</label>
          <select id="selQuality">
            <option value="high">高清（300 dpi，文件较大）</option>
            <option value="standard" selected>标准（200 dpi，推荐）</option>
            <option value="small">小体积（130 dpi，便于微信发送）</option>
          </select>
        </div>

        <label class="switch-row">
          <input type="checkbox" id="chkPageNumbers" checked />
          <span class="switch-ui" aria-hidden="true"></span>
          <span class="switch-text">页面底部显示页码</span>
        </label>

        <div class="generate-area">
          <button type="button" class="primary-btn" id="btnGenerate" disabled>
            <span class="btn-label">生成 PDF</span>
            <span class="btn-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h13M13 6l6 6-6 6" />
              </svg>
            </span>
          </button>
          <div class="progress" id="progressWrap" hidden>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-text" id="progressText">0%</span>
          </div>
          <p class="generate-hint" id="generateHint">添加图片后可生成 PDF</p>
        </div>
      </aside>
    </main>

    <section class="panel panel-result" id="resultPanel" hidden>
      <div class="result-head">
        <div>
          <h2 class="panel-title">PDF 已生成</h2>
          <p class="result-meta" id="resultMeta"></p>
        </div>
        <div class="result-actions">
          <button type="button" class="ghost-btn" id="btnAgain">调整后重新生成</button>
          <a class="ghost-btn" id="btnOpen" target="_blank" rel="noopener">新窗口打开</a>
          <a class="primary-btn is-small" id="btnDownload" download>
            <span class="btn-label">下载 PDF</span>
          </a>
        </div>
      </div>
      <div class="preview-strip" id="previewStrip"></div>
      <p class="preview-note" id="previewNote" hidden></p>
    </section>

    <footer class="footer">
      所有图片只在当前浏览器中处理，不会上传到任何服务器；关闭页面即清除。
    </footer>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-overlay-inner">
      <div class="dropzone-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11M7.5 10.5L12 15l4.5-4.5" />
          <path d="M4.5 18.5h15" />
        </svg>
      </div>
      <p>松开鼠标即可添加图片</p>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片大图预览">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭预览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6l-12 12" />
      </svg>
    </button>
    <figure class="lightbox-figure">
      <div class="lightbox-stage" id="lightboxStage"></div>
      <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="pdf-core.js"></script>
  <script src="app.js"></script>
</body>
</html>

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-core:
    name: Web core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check pdf-core.js
          node --check app.js
      - name: Unit tests
        run: node --test tests/pdf-core.test.mjs

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
